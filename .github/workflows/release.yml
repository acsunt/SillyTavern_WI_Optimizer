name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的标签时触发，如 v3.3, v3.4
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Build bundle.json
      shell: pwsh
      run: |
        .\build.ps1
        
    - name: Create CDN version with auto-update
      shell: pwsh
      run: |
        $bundleContent = Get-Content "dist/bundle.json" -Raw -Encoding UTF8 | ConvertFrom-Json
        
        $version = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { 
          $matches[1] 
        } else { 
          "dev-$(Get-Date -Format 'yyyyMMdd')" 
        }
        
        $cdnScript = @'
        (async function() {
            const REPO = 'acsunt/SillyTavern_WI_Optimizer';
            const RELEASE_API = 'https://api.github.com/repos/' + REPO + '/releases/latest';
            const PLUGIN_ID = '0266db8e-add9-49c0-bfca-3b237bbb1eaf';
            const PLUGIN_NAME = '世界书&正则管理器';
            
            console.log('[世界书管理器] 开始加载...');
            
            try {
                // 获取最新 Release 信息
                const releaseResp = await fetch(RELEASE_API);
                if (!releaseResp.ok) throw new Error('获取版本信息失败: ' + releaseResp.status);
                
                const releaseData = await releaseResp.json();
                const latestVersion = releaseData.tag_name || 'unknown';
                
                console.log('[世界书管理器] 最新版本:', latestVersion);
                
                // 从 Release 资源中找到 bundle.js
                const asset = releaseData.assets.find(a => a.name === 'bundle.js');
                if (!asset) throw new Error('未找到 bundle.js 文件');
                
                // 从 jsDelivr CDN 加载（使用版本号，永久缓存但确保是正确版本）
                const cdnUrl = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + latestVersion + '/dist/bundle.js';
                
                console.log('[世界书管理器] 加载地址:', cdnUrl);
                
                const response = await fetch(cdnUrl);
                if (!response.ok) {
                    // CDN 失败则尝试从 GitHub Release 直接下载
                    console.warn('[世界书管理器] CDN 加载失败，尝试直接下载');
                    const directResp = await fetch(asset.browser_download_url);
                    if (!directResp.ok) throw new Error('加载失败: ' + directResp.status);
                    const code = await directResp.text();
                    eval(code);
                } else {
                    const code = await response.text();
                    eval(code);
                }
                
                console.log('[世界书管理器] 加载成功');
                
                toastr.success('版本: ' + latestVersion, PLUGIN_NAME + ' 已加载', {
                    timeOut: 3000,
                    positionClass: 'toast-top-right'
                });
                
            } catch (error) {
                console.error('[世界书管理器] 加载失败:', error);
                toastr.error('加载失败: ' + error.message, PLUGIN_NAME, {
                    timeOut: 5000,
                    positionClass: 'toast-top-right'
                });
            }
        })();
        '@
        
        $cdnBundle = @{
          id = $bundleContent.id
          name = $bundleContent.name + " (自动更新)"
          content = $cdnScript
        } | ConvertTo-Json -Depth 10
        
        [System.IO.File]::WriteAllText("dist/bundle_cdn.json", $cdnBundle, [System.Text.Encoding]::UTF8)
        
        Write-Host "✓ 已创建 CDN 自动更新版本" -ForegroundColor Green
        
    - name: Extract bundle.js from bundle.json
      shell: pwsh
      run: |
        $bundle = Get-Content "dist/bundle.json" -Raw -Encoding UTF8 | ConvertFrom-Json
        $jsContent = $bundle.content
        
        # 将转义的换行符还原
        $jsContent = $jsContent -replace '\\n', "`n"
        $jsContent = $jsContent -replace '\\t', "`t"
        $jsContent = $jsContent -replace '\\"', '"'
        
        [System.IO.File]::WriteAllText("dist/bundle.js", $jsContent, [System.Text.Encoding]::UTF8)
        Write-Host "✓ 已提取 bundle.js" -ForegroundColor Green
        
    - name: Get version
      id: get_version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { 
          $matches[1] 
        } else { 
          "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')" 
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "版本: $version"
        
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/bundle.json
          dist/bundle_cdn.json
          dist/bundle.js
        body: |
          ## 📦 SillyTavern 世界书管理器 ${{ steps.get_version.outputs.version }}
          
          ### 安装方法
          
          **标准版本（bundle.json）**：
          1. 下载 `bundle.json`
          2. 在 SillyTavern 的 JS-Slash-Runner 扩展中导入
          3. 激活脚本并刷新页面
          
          **自动更新版本（bundle_cdn.json）**：
          1. 下载 `bundle_cdn.json`
          2. 在 SillyTavern 的 JS-Slash-Runner 扩展中导入
          3. 激活脚本并刷新页面
          4. 每次启动 SillyTavern 时会自动检查并加载最新版本
          
          ### 文件说明
          - `bundle.json` - 完整打包版本（推荐）
          - `bundle_cdn.json` - CDN 自动更新版本
          - `bundle.js` - 未打包的 JavaScript 源码（供开发者使用）
          
          ---
          
          完整功能说明请查看 [README](https://github.com/acsunt/SillyTavern_World_Info_Optimizer/blob/main/README.md)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
